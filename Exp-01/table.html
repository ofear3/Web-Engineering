<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>

    <center>


        <table border="1" cellpadding="10" cellspacing="0">

            <thead>
                <th>A</th>
                <th>B</th>
                <th>C</th>
                <th>D</th>
                <th>E</th>
            </thead>

            <tfoot>
                <tr>
                    <td colspan="5"> zzz</td></tr>
            </tfoot>

            <tbody>

                <tr>
                    <td>F</td>
                    <td>G</td>
                    <td rowspan="2" colspan="2">H</td>
                    <td>I</td>
                </tr>

                <tr>
                    <td>J</td>
                    <td>K</td>
                    <td>L</td>
                </tr>

                <tr>
                    <td>M</td>
                    <td rowspan="3">N</td>
                    <td>O</td>
                    <td>P</td>
                    <td>Q</td>
                </tr>

                <tr>
                    <td rowspan="2">R</td>
                    <td>S</td>
                    <td colspan="2">T</td>
                </tr>

                <tr>
                    <td colspan="3">U</td>
                </tr>
            </tbody>


        </table>


    </center>
    
</body>
</html>
