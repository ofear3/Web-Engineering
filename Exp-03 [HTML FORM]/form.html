<!DOCTYPE html>
<html lang="en">

    <title>Student Information</title>

<body>
    <div>
        <center>
            <h1>Student Information Form</h1> </center>
            <br>
            <form id="stdform">
                <fieldset>
                    <legend>Personal Information</legend>
                    <br><label>First Name</label>
                    <input type="text" id="fname" placeholder="e.g Mohammad" required>
                    <br><br><label>Last Name</label>

                    <input type="text" id="lname" placeholder="e.g Saif" required>
                    <br><br><label>Email</label>
                    <input type="email" id="email" placeholder="e.g m.saif@gmail.com" required>  

                    <br><br><label>Age</label>
                    <input type="number" id="age" placeholder="8-40" min="8" max="40" required>
                    
                    <br><br>
                    <label>Gender</label>
                    
                    <input type="radio" id="male" name="gender" value="Male" checked required>
                    <label for="male">Male</label>
                    
                    <input type="radio" id="female" name="gender" value="Female" required>
                    <label for="female">Female</label>
                </fieldset>
<br> <br>
                <fieldset>
                    <legend>University Information</legend>
                    <br>
                    <lable>Student ID</lable>
                    <input type="number" id="stdid" placeholder="e.g 22003" required>
                    <br><br>
                    <label>Session</label>
                    <select id="session">
                        <option value="2020-21">2020-21</option>
                        <option value="2021-22">2021-22</option>
                        <option value="2022-23">2022-23</option>
                        <option value="2024-25">2024-25</option>
                        <option value="2025-26">2025-26</option>
                    </select>
                    <br><br>
                    <label>Department</label>
                    <input type="radio" id="CSE" name="dept" value="CSE" checked required>
                    <label for="male">CSE</label>
                    
                    <input type="radio" id="ECE" name="dept" value="ECE" required>
                    <label for="female">ECE</label>

                    <input type="radio" id="ECE" name="dept" value="BBA" required>
                    <label for="female">BBA</label>
                </fieldset>

                <center>
                    <br><br>
                    <button type="submit">Submit</button>
                </center>
            </form>
    </div>



    <div>
        <center><h1>Student Form Table</h1></center>
<center>
        <table border="1" cellpadding="10" cellspacing="0">

                <th>Student ID</th>
                <th>Session</th>
                <th>Department</th>
            </thead>

            <tbody id="tablebody">            </tbody>
        </table> </center>
    </div>

</body>
