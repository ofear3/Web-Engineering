<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
<center>
    <h1>Calculator</h1>
    <div>
        <label>Enter first value </label>
        <input type="text" id="val1"> <br><br>
        <label>Enter second value </label>
        <input type="text" id="val2"> <br><br>

        <button onclick="add()">Additon</button>
        <button onclick="sub()">Subtraction</button>
        <button onclick="mul()">Multiplication</button>
        <button onclick="div()">Division</button>
    
        

        <p id="res"> </p>

        <script>
                
            function add(){
                const num1 = Number(document.getElementById("val1").value);
                const num2 = Number(document.getElementById("val2").value);

                const res =  num1 + num2;

                document.getElementById("res").innerHTML = "Result : " + res;
                const result = document.getElementById("res");
                result.style.color= "red";

            }


                          
            function sub(){
                const num1 = Number(document.getElementById("val1").value);
                const num2 = Number(document.getElementById("val2").value);

                const res =  num1 - num2;

                document.getElementById("res").innerHTML = "Result : " + res;
                const result = document.getElementById("res");
                result.style.color= "green";

            }



                          
            function mul(){
                const num1 = Number(document.getElementById("val1").value);
                const num2 = Number(document.getElementById("val2").value);

                const res =  num1 * num2;

                document.getElementById("res").innerHTML = "Result : " + res;
                const result = document.getElementById("res");
                result.style.color= "blue";

            }



                          
            function div(){
                const num1 = Number(document.getElementById("val1").value);
                const num2 = Number(document.getElementById("val2").value);

                const res =  num1 / num2;

                document.getElementById("res").innerHTML = "Result : " + res;
                const result = document.getElementById("res");
                result.style.color= "purple";

            }


        </script>

    </div>
</center>
</body>
</html>
